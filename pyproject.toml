[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "simccxt"
version = "0.1.0"
description = "Virtual Cryptocurrency Exchange - CCXT-compatible exchange simulator (optional Python bindings; the main app is Rust + TypeScript and needs no Python)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "simccxt team" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
# No runtime dependencies: the engine is pure Rust, the terminal is
# TypeScript. The remaining examples/ scripts use only the standard library.
dependencies = []

[tool.maturin]
manifest-path = "src/python-api/Cargo.toml"
module-name = "simccxt"
features = ["pyo3/extension-module"]
