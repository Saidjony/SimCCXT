[package]
name = "simccxt-event-bus"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Event bus for simccxt exchange simulator"
license = "MIT"

[dependencies]
simccxt-core = { path = "../core" }
simccxt-clock = { path = "../clock" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }