[package]
name = "simccxt-feature-engine"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Feature engine module for simccxt exchange simulator"
license = "MIT"

[dependencies]
simccxt-core = { path = "../core" }
simccxt-indicators = { path = "../indicators" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
chrono = "0.4"