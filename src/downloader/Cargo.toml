[package]
name = "simccxt-downloader"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Downloader module for simccxt exchange simulator"
license = "MIT"

[dependencies]
simccxt-core = { path = "../core" }
simccxt-storage = { path = "../storage" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
chrono = "0.4"