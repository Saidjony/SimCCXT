[package]
name = "simccxt-python-api"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Python API (PyO3) bindings for simccxt exchange simulator"
license = "MIT"

[lib]
name = "simccxt"
crate-type = ["cdylib", "rlib"]

[dependencies]
simccxt-core = { path = "../core" }
simccxt-exchange = { path = "../exchange" }
simccxt-broker = { path = "../broker" }
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = "1.0"
csv = "1.3"
