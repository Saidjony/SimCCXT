[package]
name = "simccxt-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly adapter for the simccxt exchange engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde_json = "1.0"
simccxt-broker = { path = "../broker" }
simccxt-core = { path = "../core" }
simccxt-exchange = { path = "../exchange" }
