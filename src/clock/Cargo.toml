[package]
name = "simccxt-clock"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Time engine for simccxt exchange simulator"
license = "MIT"

[dependencies]
simccxt-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
