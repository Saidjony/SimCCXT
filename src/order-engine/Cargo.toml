[package]
name = "simccxt-order-engine"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Order engine module for simccxt exchange simulator"
license = "MIT"

[dependencies]
simccxt-core = { path = "../core" }
simccxt-clock = { path = "../clock" }
simccxt-market = { path = "../market" }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }