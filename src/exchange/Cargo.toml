[package]
name = "simccxt-exchange"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Exchange implementation for simccxt"
license = "MIT"

[dependencies]
simccxt-core = { path = "../core" }
simccxt-clock = { path = "../clock" }
simccxt-market = { path = "../market" }
simccxt-broker = { path = "../broker" }
simccxt-order-engine = { path = "../order-engine" }
simccxt-portfolio = { path = "../portfolio" }
simccxt-wallet = { path = "../wallet" }
simccxt-storage = { path = "../storage" }
simccxt-event-bus = { path = "../event-bus" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }