[package]
name = "simccxt-wallet"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Wallet module for simccxt exchange simulator"
license = "MIT"

[dependencies]
simccxt-core = { path = "../core" }
simccxt-clock = { path = "../clock" }
simccxt-market = { path = "../market" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }