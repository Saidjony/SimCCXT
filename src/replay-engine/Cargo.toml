[package]
name = "simccxt-replay-engine"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Replay engine for simccxt exchange simulator"
license = "MIT"

[dependencies]
simccxt-core = { path = "../core" }
simccxt-clock = { path = "../clock" }
simccxt-market = { path = "../market" }
simccxt-storage = { path = "../storage" }
simccxt-event-bus = { path = "../event-bus" }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }