[package]
name = "simccxt-core"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Core components and types for simccxt exchange simulator"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
anyhow = "1.0"