[package]
name = "simccxt-core"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "Core components and types for simccxt exchange simulator"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde_json = "1.0"
anyhow = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", features = ["clock"] }