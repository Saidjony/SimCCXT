[package]
name = "simccxt-server"
version = "0.1.0"
edition = "2021"
authors = ["simccxt team"]
description = "WebSocket server exposing the simccxt Rust exchange simulator to the TypeScript frontend"
license = "MIT"

[[bin]]
name = "simccxt-server"
path = "src/main.rs"

[dependencies]
simccxt-core = { path = "../core" }
simccxt-exchange = { path = "../exchange" }
simccxt-broker = { path = "../broker" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
ccxt = { version = "4.5.84", default-features = false, features = ["binance", "bybit", "okx"] }
